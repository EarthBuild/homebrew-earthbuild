name: CI

on:
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: earthbuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Dynamically fetch & update release checksums for version bump PRs (e.g. from Renovate) before testing
      - name: Update checksums
        run: python3 scripts/update-checksums.py

      - name: Bootstrap buildkitd
        run: earth bootstrap

      - name: Lint
        run: earth --ci +lint

      - name: Test
        run: earth --ci +test
